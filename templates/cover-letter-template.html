<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Cover Letter</title>
<!--
  naija-job-ops cover letter template
  Placeholders: {{LANG}} {{NAME}} {{EMAIL}} {{PHONE}} {{LOCATION}} {{LINKEDIN_URL}} {{LINKEDIN_DISPLAY}}
                {{PAGE_WIDTH}} {{DATE}} {{RECIPIENT_BLOCK}} {{SUBJECT}} {{SALUTATION}} {{BODY}} {{SIGN_OFF}}
  {{RECIPIENT_BLOCK}} is lines joined with <br> (e.g. "The Hiring Manager<br>Wema Bank Plc<br>Lagos").
  {{BODY}} is 3–4 <p> paragraphs. Remove the LinkedIn span if the user has no LinkedIn.
  Render: node generate-pdf.mjs output/cl-….html output/cl-….pdf --format=a4
-->
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    line-height: 1.6;
    color: #1a1a2e;
    background: #ffffff;
  }

  .page { width: 100%; max-width: {{PAGE_WIDTH}}; margin: 0 auto; padding: 2px 0; }

  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-bottom: 10px;
  }
  .contact-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 10.5px; color: #555; }
  .contact-row a { color: #555; text-decoration: none; }

  .meta { margin-top: 26px; font-size: 11px; color: #333; }
  .meta .date { margin-bottom: 14px; }
  .subject { margin-top: 18px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; }
  .salutation { margin-top: 16px; }
  .body p { margin-top: 12px; text-align: left; }
  .signoff { margin-top: 22px; }
  .signoff .name { margin-top: 30px; font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">
      <span>{{EMAIL}}</span>
      <span>{{PHONE}}</span>
      <span>{{LOCATION}}</span>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>
    </div>
  </div>

  <div class="meta">
    <div class="date">{{DATE}}</div>
    <div class="recipient">{{RECIPIENT_BLOCK}}</div>
  </div>

  <div class="subject">{{SUBJECT}}</div>
  <div class="salutation">{{SALUTATION}}</div>

  <div class="body">
    {{BODY}}
  </div>

  <div class="signoff">
    <div>{{SIGN_OFF}}</div>
    <div class="name">{{NAME}}</div>
  </div>
</div>
</body>
</html>
