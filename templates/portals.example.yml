# naija-job-ops — Portal Scanner Configuration
# Used by /naija-jobs scan (and `node scan.mjs`) to discover new job listings.
#
# HOW TO USE:
#   1. Copy this file to portals.yml in the project root (onboarding does this for you)
#   2. Set search.keywords to YOUR target roles — any field works
#   3. Adjust title_filter, add/remove companies, enable/disable boards
#
# SOURCES (all additive, deduplicated, ranked by freshness + competition + fit):
#   linkedin        Logged-out LinkedIn search — newest first, applicant counts. No account needed.
#   boards          Nigerian job boards — Jobberman, MyJobMag, HotNigerianJobs, NgCareers, Jobgurus, Indeed NG
#   remote          Remote boards filtered to roles open to Nigeria — Remotive, RemoteOK, Himalayas, Jobicy, WWR
#   ats             tracked_companies on Greenhouse/Lever/Ashby/Workable/SmartRecruiters (API)
#   browser         Anything that blocks scripts (Indeed, custom career sites) → Playwright via /naija-jobs scan
#
# Quick commands:
#   node scan.mjs                                  # everything, keywords below
#   node scan.mjs --source linkedin --since 1h     # LinkedIn, posted in the last hour
#   node scan.mjs --keywords "nurse" --source boards
#   node scan.mjs --source remote --since 3d

# ── Search defaults ──────────────────────────────────────────────────────────
search:
  keywords:                  # [CUSTOMISE] 2–5 short phrases; overridden by --keywords
    - "software engineer"
    - "data analyst"
    - "graduate trainee"
  location: "Nigeria"        # or "Lagos, Nigeria", "Abuja, Nigeria"
  since: "24h"               # 1h | 6h | 24h | 3d | 1w — how recent postings must be
  experience: []             # LinkedIn levels: internship, entry, associate, mid, director
  sources: [linkedin, boards, remote, ats]
  max_per_source: 40
  min_rank: 35               # only listings ranked ≥ this go to data/pipeline.md
  min_fit: 40                # ...and with quick profile fit ≥ this

# ── LinkedIn (logged-out, public job search) ─────────────────────────────────
# Uses LinkedIn's public guest job pages — no login, no cookies, your account is never involved.
# Requests are sequential with 1.5–3.5s delays. If rate-limited, wait 15–30 minutes.
# Personal use only — respect LinkedIn's terms; don't run it in tight loops.
linkedin:
  enabled: true
  details: 15                # fetch applicant count + description for the N freshest results
  workplace: []              # onsite, remote, hybrid
  # geo_id: 105365761        # optional LinkedIn geoId for Nigeria (location text works without it)

# ── Nigerian job boards ──────────────────────────────────────────────────────
# Built-in boards are defined in sources/boards.mjs. Override any by id, or add new ones.
# Fields: id, name, search_url ({q} = keywords, {days} = window), latest_url, job_link (regex), enabled, needs_browser
# If a board changes its site and shows up as "needs browser", fix its job_link/search_url here.
job_boards:
  - { id: jobberman, enabled: true }
  - { id: myjobmag, enabled: true }
  - { id: hotnigerianjobs, enabled: true }
  - { id: ngcareers, enabled: true }
  - { id: jobgurus, enabled: true }
  - { id: indeed-ng, enabled: true }        # browser-only (Cloudflare)
  # Example of adding your own board:
  # - id: myboard
  #   name: "My Board"
  #   search_url: "https://example.ng/jobs?q={q}"
  #   job_link: "^https://example\\.ng/job/[a-z0-9-]+"

# ── Remote boards ────────────────────────────────────────────────────────────
remote_boards:
  enabled: true
  sources: [remotive, remoteok, himalayas, jobicy, weworkremotely]
  since: "7d"                # remote boards post less often — a wider window works better
  include_restricted: false  # true = also show US/EU-only roles (you usually can't take them)

# ── Title filter ──────────────────────────────────────────────────────────────
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive keyword must match AND 0 negative keywords can match.
# All comparisons are case-insensitive.

title_filter:
  positive:
    # [CUSTOMISE] Add keywords matching YOUR target roles
    # ── Tech roles ──
    - "Software Engineer"
    - "Software Developer"
    - "Backend Developer"
    - "Frontend Developer"
    - "Fullstack Developer"
    - "Mobile Developer"
    - "Android Developer"
    - "iOS Developer"
    - "Data Analyst"
    - "Data Engineer"
    - "Business Analyst"
    - "Product Manager"
    - "Product Designer"
    - "UX Designer"
    - "DevOps"
    - "Cloud Engineer"
    - "Cybersecurity"
    - "IT Support"
    - "Systems Administrator"
    # ── Finance and banking ──
    - "Financial Analyst"
    - "Credit Analyst"
    - "Risk Analyst"
    - "Audit"
    - "Accountant"
    - "Treasury"
    - "Investment"
    - "Compliance Officer"
    # ── Graduate and trainee ──
    - "Graduate Trainee"
    - "Management Trainee"
    - "NYSC"
    - "Corps Member"
    - "Industrial Training"
    - "IT Student"
    - "Intern"
    - "Entry Level"
    - "Fresh Graduate"
    - "Junior"
    # ── General professional ──
    - "Business Development"
    - "Marketing Executive"
    - "HR Officer"
    - "Supply Chain"
    - "Procurement"
    - "Project Officer"
    - "Programme Officer"
  negative:
    # [CUSTOMISE] Add keywords for roles you want to exclude
    - "Senior Manager"
    - "Director"
    - "Head of"
    - "VP "
    - "Vice President"
    - "C-Level"
    - "10+ years"
    - "15 years"
    - "20 years"
  seniority_boost:
    # These terms add relevance priority but are not required filters
    - "Junior"
    - "Entry Level"
    - "Graduate"
    - "Trainee"
    - "Associate"

# ── Extra WebSearch queries (used by /naija-jobs scan in Claude, not by scan.mjs) ─
# Good for sources no scraper covers: government portals, graduate schemes, niche boards.
# Results may be stale — they are verified with Playwright before joining the pipeline.

search_queries:
  - query: "Graduate Trainee 2026 site:jobberman.com"
    enabled: true
  - query: "Management Trainee Nigeria 2026 site:myjobmag.com"
    enabled: true
  - query: "NYSC corps member recruitment Nigeria site:ngcareers.com"
    enabled: true
  - query: "Entry level software engineer Nigeria site:ng.indeed.com"
    enabled: true
  - query: "Junior developer Nigeria Lagos 2026 site:hotnigerianjobs.com"
    enabled: true
  - query: "recruitment 2026 site:gov.ng"
    enabled: true
  - query: "Management Trainee banking Nigeria 2026"
    enabled: true
  - query: "Software Engineer entry level Lagos Nigeria 2026"
    enabled: true
  - query: "Data Analyst fresh graduate Nigeria 2026"
    enabled: true
  - query: "Industrial Training IT student Nigeria technology"
    enabled: true
  - query: "Financial Analyst NYSC Nigeria 2026"
    enabled: false
  - query: "HR Officer graduate Nigeria 2026"
    enabled: false

